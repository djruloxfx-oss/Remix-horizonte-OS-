<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horizonte OS · Aplicar parches v19.4</title>
<style>
:root{color-scheme:dark}
body{margin:0;padding:20px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#05070c;color:#eaf7ff;max-width:560px;margin-inline:auto}
h1{font-size:1.3rem;margin:.4rem 0 .2rem}
p{color:#86a2ba;margin:.3rem 0 1rem}
input[type=file]{width:100%;box-sizing:border-box;padding:16px;border:1px dashed rgba(0,245,255,.4);border-radius:18px;background:#0a1220;color:#eaf7ff}
pre{white-space:pre-wrap;background:#0a1220;border:1px solid rgba(0,245,255,.22);border-radius:16px;padding:14px;font-size:14px;line-height:1.55}
a.btn{display:block;text-align:center;margin-top:16px;padding:15px;border-radius:999px;background:linear-gradient(135deg,#00f5ff,#8b5cf6);color:#06111c;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<h1>Horizonte OS: aplicar parches</h1>
<p>Elige tu archivo actual (.html de la v19.3) y descarga la v19.4 corregida. Todo ocurre en tu dispositivo.</p>
<input type="file" id="f" accept=".html,text/html">
<pre id="out" hidden></pre>
<div id="dl"></div>
<script>
const out = document.getElementById('out');
const dl = document.getElementById('dl');

function rep(src, find, to, name, L){
  const n = src.split(find).length - 1;
  if(!n){ L.push('⚠ No encontrado (¿ya aplicado?): ' + name); return src; }
  L.push('✅ ' + name + (n > 1 ? ' (x' + n + ')' : ''));
  return src.split(find).join(to);
}

function patch(src){
  const L = [];

  // 1. Importar JSON: leer el estado y aplicarlo de verdad
  src = rep(src, 'const mig=hzMigrateState(raw);', 'const mig=hzMigrateState(raw.state||raw);', '1a Importar JSON: leer el estado', L);
  src = rep(src, 'window.state = mig;', 'state = {...clone(seed), ...mig, running:false}; window.state = state;', '1b Importar JSON: aplicar el estado', L);

  // 2. Paquete 2: guardar en la lista correcta (memories)
  src = rep(src, 'window.state.memorias = window.state.memorias || [];', '', '2a Paquete 2: quitar lista errónea', L);
  src = rep(src, 'window.state.memorias.unshift(entrada);', 'state.memories.unshift(entrada);', '2b Paquete 2: guardar en Memorias', L);

  // 3. Timer: no redibujar toda la app cada segundo
  const re = /(log\("Tiempo terminado\. Alarma activa\."\);\s*\}\s*)render\(\);(\s*\}, 1000\);)/;
  if(re.test(src)){
    src = src.replace(re, (m, a, b) => a + 'else $("timer").textContent = formatTime(state.remaining);' + b);
    L.push('✅ 3 Timer: ya no borra lo que escribes');
  }else{
    L.push('⚠ No encontrado (¿ya aplicado?): 3 Timer');
  }

  // 4. Exportar JSON: sin segunda descarga automática
  src = rep(src, 'if(window.hzBackupBeforeExport) hzBackupBeforeExport(state);', '', '4 Exportar JSON: sin descarga extra', L);

  // 5. Comando dryrun (móvil)
  src = rep(src, 'if(lower === "help"){', 'if(lower === "dryrun"){ $("hzn-dryrun-panel").hidden = false; hzRunDryRun(); return; }\n  if(lower === "help"){', '5a Comando dryrun', L);
  src = rep(src, '"--- Paquete 2 ---",', '"--- Paquete 2 ---",\n      "dryrun",', '5b dryrun en la ayuda', L);

  // Versión 19.3 -> 19.4 (el schema 19.3.0 no cambia)
  const vers = [
    ['<title>Horizonte OS v19.3 + Paquete 2</title>', '<title>Horizonte OS v19.4 + Paquete 2</title>'],
    ['<span>v19.3 + Paquete 2</span>', '<span>v19.4 + Paquete 2</span>'],
    ['[v19.3 Kernel Local]', '[v19.4 Kernel Local]'],
    ['version: "19.3",', 'version: "19.4",'],
    ['VERSION: 19.3', 'VERSION: 19.4'],
    ['NOMBRE: Horizonte OS v19.3', 'NOMBRE: Horizonte OS v19.4'],
    ['v19-3-backup', 'v19-4-backup']
  ];
  let nv = 0;
  vers.forEach(([a, b]) => { if(src.includes(a)){ src = src.split(a).join(b); nv++; } });
  L.push(nv ? '✅ Versión 19.3 → 19.4 (' + nv + ' sitios)' : '⚠ No encontrado (¿ya aplicado?): versión');

  const ok = L.filter(l => l.startsWith('✅')).length;
  return { src, L, ok };
}

document.getElementById('f').onchange = async e => {
  const file = e.target.files[0];
  dl.innerHTML = '';
  if(!file) return;
  const txt = await file.text();
  out.hidden = false;
  if(!txt.includes('hzImportJSON')){
    out.textContent = '❌ Este archivo no parece Horizonte OS v19.3 con Paquete 2. Elige el .html correcto.';
    return;
  }
  const r = patch(txt);
  out.textContent = r.L.join('\n');
  if(!r.ok) return;
  const url = URL.createObjectURL(new Blob([r.src], { type: 'text/html;charset=utf-8' }));
  dl.innerHTML = '<a class="btn" download="horizonte_os_v19_4.html" href="' + url + '">Descargar horizonte_os_v19_4.html</a>';
};
</script>
</body>
</html>
